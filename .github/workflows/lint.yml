name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck on scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          additional_files: "install.sh uninstall.sh"
      - name: Run ShellCheck on hook scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: plugin/hooks/scripts

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            *.md
            plugin/**/*.md

  validate-json:
    name: Validate JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin.json
        run: jq empty plugin/.claude-plugin/plugin.json
      - name: Validate marketplace.json
        run: jq empty .claude-plugin/marketplace.json
      - name: Validate settings-hooks.json
        run: jq empty plugin/settings-hooks.json
      - name: Validate hooks.json
        run: jq empty plugin/hooks/hooks.json
      - name: Validate hardening profiles
        run: jq empty plugin/hardening/profiles/*.json
      - name: Validate hardening policies
        run: jq empty plugin/hardening/defaults/*.json plugin/hardening/security-policy.schema.json
      - name: Validate test fixtures
        run: jq empty tests/fixtures/*.json

  bash-integration:
    name: Bash Integration Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: |
          if command -v jq >/dev/null 2>&1; then
            exit 0
          fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y jq
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install jq
          fi
      - name: Run Bash integration tests
        run: |
          bash tests/test-hooks.sh
          bash tests/test-install.sh
          bash tests/test-rules.sh
          bash tests/test-hardening-profiles.sh
          bash tests/test-harden-skill.sh
          bash tests/test-doctor-skill.sh
          bash tests/test-docs-hardening.sh

  python-tests:
    name: Python Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Discovery rather than a hand-written list: a new module or test file must
      # not drop out of CI silently just because someone forgot to add it here.
      - name: Compile Python files
        run: >
          python -m compileall -q
          plugin/hardening
          plugin/hooks
          tests
      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py"
