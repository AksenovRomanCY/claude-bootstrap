name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck on scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          additional_files: "install.sh uninstall.sh"
      - name: Run ShellCheck on hook scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: plugin/hooks/scripts

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            *.md
            plugin/**/*.md

  validate-json:
    name: Validate JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin.json
        run: jq empty plugin/.claude-plugin/plugin.json
      - name: Validate marketplace.json
        run: jq empty .claude-plugin/marketplace.json
      - name: Validate settings-hooks.json
        run: jq empty plugin/settings-hooks.json
      - name: Validate hooks.json
        run: jq empty plugin/hooks/hooks.json
      - name: Validate hardening profiles
        run: jq empty plugin/hardening/profiles/*.json
      - name: Validate hardening policies
        run: jq empty plugin/hardening/defaults/*.json plugin/hardening/security-policy.schema.json
      - name: Validate test fixtures
        run: jq empty tests/fixtures/*.json

  test-hooks:
    name: Hook Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Run hook tests
        run: bash tests/test-hooks.sh

  test-install:
    name: Install/Uninstall Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Run install tests
        run: bash tests/test-install.sh

  test-rules:
    name: Rule Inventory Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run rule inventory tests
        run: bash tests/test-rules.sh

  test-hardening-profiles:
    name: Hardening Profile Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Run hardening profile tests
        run: bash tests/test-hardening-profiles.sh

  test-harden-skill:
    name: Harden Skill Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run harden skill tests
        run: bash tests/test-harden-skill.sh

  test-doctor-skill:
    name: Doctor Skill Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run doctor skill tests
        run: bash tests/test-doctor-skill.sh

  test-apply-profile:
    name: Apply Profile Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python files
        run: python3 -m compileall plugin/hardening/apply_profile.py plugin/hooks/scripts/command_guard.py plugin/hooks/scripts/large_file_policy.py plugin/hooks/scripts/secret_guard.py plugin/hooks/scripts/post_write_warnings.py plugin/hooks/guard tests/test_apply_profile.py tests/test_security_policy.py tests/test_command_guard.py tests/test_large_file_policy.py tests/test_secret_guard.py tests/test_post_write_warnings.py
      - name: Run apply profile tests
        run: python3 -m unittest tests/test_apply_profile.py tests/test_security_policy.py tests/test_command_guard.py tests/test_large_file_policy.py tests/test_secret_guard.py tests/test_post_write_warnings.py
